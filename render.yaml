# Render WEB SERVICE — required for free tier (background workers are paid-only).
#
# Render auto-sets $PORT (usually 10000). The bot binds to 0.0.0.0:$PORT
# and serves a tiny HTTP server with routes:
#   GET  /           human-readable status page (HTML, auto-refresh)
#   GET  /health     "OK" — Render's health check pings this
#   GET  /status     JSON snapshot of current bot progress
#   POST /stop       trigger graceful stop
#
# ⚠️  IMPORTANT: if you previously deployed an older version of this bot,
#     DELETE these stale env vars from Render → Environment:
#       - TELEGRAM_PROGRESS
#       - PROGRESS_CHAT
#       - PROGRESS_UPDATE_INTERVAL
#       - PROGRESS_MESSAGE_ID_FILE
#       - USE_TELEGRAM_STATE_SYNC
#       - STATE_SYNC_INTERVAL_SEC
#       - STOP_POLL_INTERVAL
#     They are no longer used. Leaving them set to "1" will have NO effect
#     (the code ignores them now), but it's cleaner to remove them.
#
# Render free tier notes:
#   - Sleeps after 15 min of no inbound HTTP traffic → bot halts.
#     Send a /status request every ~10 min from an external uptime monitor
#     (cron-job.org, uptime-robot, etc.) to keep it awake.
#   - No persistent disk → state.json is wiped on every redeploy.
#     Resume memory does NOT survive redeploys on the free tier.
#   - 750 instance-hours/month = ~31 days of always-on, but sleeps reset the
#     counter — practical limit is much higher.
#
# Required env vars (set in Render Dashboard → Environment):
#   API_ID          — from my.telegram.org
#   API_HASH        — from my.telegram.org
#   SESSION_STRING  — from running `python session_setup.py` locally
#   TARGET          — @channel or -1001234567890

services:
  - type: web
    name: tg-bulk-forwarder
    runtime: python
    plan: free                 # free tier — web service, sleeps after 15 min idle
    region: singapore           # change to your nearest region
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health   # Render pings this; must return 200 within 60s of boot
    autoDeploy: true
    envVars:
      - key: API_ID
        sync: false             # set in dashboard
      - key: API_HASH
        sync: false             # set in dashboard
      - key: SESSION_STRING
        sync: false             # set in dashboard
      - key: TARGET
        sync: false             # set in dashboard
      - key: FILTER
        value: photo,video,animation
      - key: ORDER
        value: old
      # MESSAGES per burst (NOT items — one grouped_id batch can be 50 messages).
      # Default 30 = under Telegram's per-chat sustained limit (~30 msg/min).
      # Combined with BATCH_INTERVAL_SEC=60, this gives ~30 messages/minute throughput.
      - key: BATCH_SIZE
        value: "30"
      # Within-burst delay: 0.5s between sends → 50 items in ~25s.
      - key: PER_MESSAGE_DELAY
        value: "0.5"
      # Between-burst interval: 60s between burst STARTS → ~50 items/min throughput.
      # If a burst takes 25s, we wait 35s; if it takes 70s (FloodWait), we don't wait extra.
      - key: BATCH_INTERVAL_SEC
        value: "60"
      # Cap on total Saved Messages scanned per sweep (avoids runaway memory + FloodWait
      # when Saved Messages is huge). 0 = unlimited. Default 11000 ≈ 22 MB peak RAM.
      # Lower this if you're hitting Render free-tier RAM limits (512 MB).
      - key: MAX_SCAN
        value: "11000"
      # Delay (seconds) between get_chat_history pagination calls — prevents Telegram's
      # GetHistory FloodWait penalty (which forces 24s+ waits).
      - key: PAGE_DELAY
        value: "0.5"
      - key: PYTHONUNBUFFERED
        value: "1"               # ensures logs stream in real-time on Render
      # Render auto-sets PORT — do not override it here.
